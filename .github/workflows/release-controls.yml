name: paper12 release controls
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python "[PAPER] package/verification/check_payload.py"
      - run: python "[PAPER] package/code/verify_infrared_estimates.py"
