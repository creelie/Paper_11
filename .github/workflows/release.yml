name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag, for example v2.0.0"
        required: true

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: recompute the tables and rerun the constant checks
        working-directory: code
        run: |
          python3 siegel_dyons.py /tmp/out.json > /tmp/run.log
          python3 -c "import json; a=json.load(open('/tmp/out.json')); b=json.load(open('siegel_dyons_out.json')); assert a==b, 'tables differ'; print('tables agree')"
          python3 verify_revision.py
          python3 verify_infrared_estimates.py
          pip install sympy==1.14.0 mpmath==1.3.0
          python3 verify_closures.py

  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.event.inputs.tag }}" dist/ConjecturesOfAshokeSen_final2.pdf dist/ConjecturesOfAshokeSen-tex.zip dist/ConjecturesOfAshokeSen-arxiv.tar.gz \
            --title "Proving Conjectures of Ashoke Sen: F-Theory Limits, Small Black Holes and Dyon Indices ${{ github.event.inputs.tag }}" \
            --notes-file .github/RELEASE_NOTES.md
